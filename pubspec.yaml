name: daily_bloom
description: Daily Bloom - Zen Professional task management with Kanban, heatmap and Pomodoro.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  lucide_flutter: ^1.42.0
  intl: ^0.19.0
  http: ^1.2.0
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  # Firebase Auth
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  share_plus: ^13.3.1
  speech_to_text: ^7.5.0
  home_widget: ^0.10.0
  sentry_flutter: 10.0.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/sounds/bell.wav
