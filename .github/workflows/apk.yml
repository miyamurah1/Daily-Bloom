name: apk

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend URL baked into the APK (BLOOM_API)'
        required: false
        default: 'http://localhost:8080'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # firebase_options.dart is gitignored (generated by flutterfire).
      # CI writes a stub so analyze/build pass; Firebase calls then fail
      # closed at runtime and the app runs in offline mode. Real devices
      # get their config from `flutterfire configure` (developer machine).
      - name: Generate Firebase options stub if missing
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            cat > lib/firebase_options.dart <<'EOF'
            // CI stub: real values come from `flutterfire configure`
            // (gitignored). Offline-safe: Firebase init is guarded.
            import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
            import 'package:flutter/foundation.dart'
                show TargetPlatform, defaultTargetPlatform, kIsWeb;

            class DefaultFirebaseOptions {
              static FirebaseOptions get currentPlatform {
                if (kIsWeb) {
                  return web;
                }
                switch (defaultTargetPlatform) {
                  case TargetPlatform.android:
                    return android;
                  case TargetPlatform.iOS:
                    return ios;
                  case TargetPlatform.macOS:
                    return macos;
                  case TargetPlatform.windows:
                    return windows;
                  default:
                    throw UnsupportedError(
                      'DefaultFirebaseOptions are not supported for this platform.',
                    );
                }
              }

              static const FirebaseOptions web = FirebaseOptions(
                apiKey: 'CI-STUB',
                appId: 'CI-STUB',
                messagingSenderId: 'CI-STUB',
                projectId: 'CI-STUB',
              );

              static const FirebaseOptions android = FirebaseOptions(
                apiKey: 'CI-STUB',
                appId: 'CI-STUB',
                messagingSenderId: 'CI-STUB',
                projectId: 'CI-STUB',
              );

              static const FirebaseOptions ios = FirebaseOptions(
                apiKey: 'CI-STUB',
                appId: 'CI-STUB',
                messagingSenderId: 'CI-STUB',
                projectId: 'CI-STUB',
                iosBundleId: 'CI-STUB',
              );

              static const FirebaseOptions macos = FirebaseOptions(
                apiKey: 'CI-STUB',
                appId: 'CI-STUB',
                messagingSenderId: 'CI-STUB',
                projectId: 'CI-STUB',
                iosBundleId: 'CI-STUB',
              );

              static const FirebaseOptions windows = FirebaseOptions(
                apiKey: 'CI-STUB',
                appId: 'CI-STUB',
                messagingSenderId: 'CI-STUB',
                projectId: 'CI-STUB',
              );
            }
          EOF
          fi
      - run: flutter analyze
      - run: >
          flutter build apk --release
          --dart-define=BLOOM_API=${{ inputs.api_url }}
      - uses: actions/upload-artifact@v4
        with:
          name: daily-bloom-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
