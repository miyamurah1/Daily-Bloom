name: apk

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend URL baked into the APK (BLOOM_API)'
        required: false
        default: 'http://localhost:8080'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # firebase_options.dart is gitignored. CI builds it from secrets when
      # present, else CI-STUB (offline mode: auth fails closed by design).
      - name: Generate Firebase options stub if missing
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            # Strip CR/LF/spaces: copy-paste from Windows often smuggles a
            # newline into the secret, which breaks the Dart string literal.
            API_KEY="$(printf '%s' "${FIREBASE_API_KEY:-CI-STUB}" | tr -d ' \t\r\n')"
            APP_ID="$(printf '%s' "${FIREBASE_APP_ID:-CI-STUB}" | tr -d ' \t\r\n')"
            SENDER_ID="$(printf '%s' "${FIREBASE_MESSAGING_SENDER_ID:-CI-STUB}" | tr -d ' \t\r\n')"
            PROJECT_ID="$(printf '%s' "${FIREBASE_PROJECT_ID:-CI-STUB}" | tr -d ' \t\r\n')"
            if [ -z "$API_KEY" ]; then API_KEY="CI-STUB"; fi
            if [ -z "$APP_ID" ]; then APP_ID="CI-STUB"; fi
            if [ -z "$SENDER_ID" ]; then SENDER_ID="CI-STUB"; fi
            if [ -z "$PROJECT_ID" ]; then PROJECT_ID="CI-STUB"; fi
            echo "Firebase config lengths: apiKey=${#API_KEY} appId=${#APP_ID} sender=${#SENDER_ID} project=${#PROJECT_ID}"
            cat > lib/firebase_options.dart <<EOF
            // Generated in CI from GitHub secrets (or CI-STUB offline fallback).
            import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
            import 'package:flutter/foundation.dart'
                show TargetPlatform, defaultTargetPlatform, kIsWeb;

            class DefaultFirebaseOptions {
              static FirebaseOptions get currentPlatform {
                if (kIsWeb) {
                  return web;
                }
                switch (defaultTargetPlatform) {
                  case TargetPlatform.android:
                    return android;
                  case TargetPlatform.iOS:
                    return ios;
                  case TargetPlatform.macOS:
                    return macos;
                  case TargetPlatform.windows:
                    return windows;
                  default:
                    throw UnsupportedError(
                      'DefaultFirebaseOptions are not supported for this platform.',
                    );
                }
              }

              static const FirebaseOptions web = FirebaseOptions(
                apiKey: '$API_KEY',
                appId: '$APP_ID',
                messagingSenderId: '$SENDER_ID',
                projectId: '$PROJECT_ID',
              );

              static const FirebaseOptions android = FirebaseOptions(
                apiKey: '$API_KEY',
                appId: '$APP_ID',
                messagingSenderId: '$SENDER_ID',
                projectId: '$PROJECT_ID',
              );

              static const FirebaseOptions ios = FirebaseOptions(
                apiKey: '$API_KEY',
                appId: '$APP_ID',
                messagingSenderId: '$SENDER_ID',
                projectId: '$PROJECT_ID',
                iosBundleId: 'CI-STUB',
              );

              static const FirebaseOptions macos = FirebaseOptions(
                apiKey: '$API_KEY',
                appId: '$APP_ID',
                messagingSenderId: '$SENDER_ID',
                projectId: '$PROJECT_ID',
                iosBundleId: 'CI-STUB',
              );

              static const FirebaseOptions windows = FirebaseOptions(
                apiKey: '$API_KEY',
                appId: '$APP_ID',
                messagingSenderId: '$SENDER_ID',
                projectId: '$PROJECT_ID',
              );
            }
          EOF
          fi
      - name: Warn when Firebase secrets are missing (login dead in CI)
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "::warning title=Login will be broken::FIREBASE_* secrets are not set - this APK uses CI-STUB Firebase config, so email and Google sign-in cannot work. Set the 4 FIREBASE_* secrets in Settings > Secrets and variables > Actions, then rebuild."
          fi
      - name: Configure Android release signing (when secrets provided)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          storeFile=../upload-keystore.jks
          EOF
            echo "Release signing configured from secrets (stable SHA-1)."
          else
            echo "::warning title=Debug-signed APK::Android signing secrets not set - this CI build uses an ephemeral debug key, so its SHA-1 differs on every build and Google sign-in will fail for CI-built APKs. Set ANDROID_KEYSTORE_* secrets or build locally (android/key.properties exists there)."
          fi
      - run: flutter analyze
      - run: >
          flutter build apk --release
          --dart-define=BLOOM_API=${{ inputs.api_url }}
      - uses: actions/upload-artifact@v4
        with:
          name: daily-bloom-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
