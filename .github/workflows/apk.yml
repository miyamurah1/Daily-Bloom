name: apk

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend URL baked into the APK (BLOOM_API)'
        required: false
        default: 'https://daily-bloom-api.onrender.com'
      build_name:
        description: 'Version name for this build (default: pubspec version)'
        required: false
      build_number:
        description: 'Version code for this build; must increase per install (default: pubspec +N)'
        required: false
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Render derives the public URL from the service name in render.yaml.
      # Manual runs can override it with workflow_dispatch -> api_url.
      API_URL: ${{ inputs.api_url || 'https://daily-bloom-api.onrender.com' }}
      # Non-secret expectations for the verification gates. Deliberately NOT
      # populated from secrets: GitHub masks any log line containing a secret
      # value, which turned these gate messages into "***" and made the build
      # log unreadable.
      EXPECTED_SIGNER_SHA1: '22D641627F121F81C7DA0B9EE97EAFB8D577C305'
      EXPECTED_FIREBASE_PROJECT: 'daily-bloom-6aca1'
      EXPECTED_ANDROID_APP_ID: '1:789612027996:android:120c7517d18fb54ec28699'
      EXPECTED_WEB_CLIENT_ID: '789612027996-nri9p33e5djdd56atjmlqou5fi9mcq9o.apps.googleusercontent.com'
    steps:
      - uses: actions/checkout@v4
      - name: Guard against an empty backend URL
        run: |
          if [ -z "$(printf '%s' "$API_URL" | tr -d ' \t\r\n')" ]; then
            echo "::error title=Missing backend URL::Set api_url in the manual run or configure the Render backend URL."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pin to the SDK the app is validated against. Newer stable
          # releases (3.50+) deprecate package:flutter/material.dart, which
          # makes `flutter analyze` fail on infos before the build can run.
          flutter-version: '3.44.6'
      # firebase_options.dart is gitignored. CI builds it from secrets when
      # present, else CI-STUB (offline mode: auth fails closed by design).
      - name: Generate Firebase options stub if missing
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            # Strip CR/LF/spaces: copy-paste from Windows often smuggles a
            # newline into the secret, which breaks the Dart string literal.
            API_KEY="$(printf '%s' "${FIREBASE_API_KEY:-CI-STUB}" | tr -d ' \t\r\n')"
            APP_ID="$(printf '%s' "${FIREBASE_APP_ID:-CI-STUB}" | tr -d ' \t\r\n')"
            SENDER_ID="$(printf '%s' "${FIREBASE_MESSAGING_SENDER_ID:-CI-STUB}" | tr -d ' \t\r\n')"
            PROJECT_ID="$(printf '%s' "${FIREBASE_PROJECT_ID:-CI-STUB}" | tr -d ' \t\r\n')"
            if [ -z "$API_KEY" ]; then API_KEY="CI-STUB"; fi
            if [ -z "$APP_ID" ]; then APP_ID="CI-STUB"; fi
            if [ -z "$SENDER_ID" ]; then SENDER_ID="CI-STUB"; fi
            if [ -z "$PROJECT_ID" ]; then PROJECT_ID="CI-STUB"; fi
            echo "Firebase config lengths: apiKey=${#API_KEY} appId=${#APP_ID} sender=${#SENDER_ID} project=${#PROJECT_ID}"
            cat > lib/firebase_options.dart <<EOF
            // Generated in CI from GitHub secrets (or CI-STUB offline fallback).
            import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
            import 'package:flutter/foundation.dart'
                show TargetPlatform, defaultTargetPlatform, kIsWeb;

            class DefaultFirebaseOptions {
              static FirebaseOptions get currentPlatform {
                if (kIsWeb) {
                  return web;
                }
                switch (defaultTargetPlatform) {
                  case TargetPlatform.android:
                    return android;
                  case TargetPlatform.iOS:
                    return ios;
                  case TargetPlatform.macOS:
                    return macos;
                  case TargetPlatform.windows:
                    return windows;
                  default:
                    throw UnsupportedError(
                      'DefaultFirebaseOptions are not supported for this platform.',
                    );
                }
              }

              static const FirebaseOptions web = FirebaseOptions(
                apiKey: '$API_KEY',
                appId: '$APP_ID',
                messagingSenderId: '$SENDER_ID',
                projectId: '$PROJECT_ID',
              );

              static const FirebaseOptions android = FirebaseOptions(
                apiKey: '$API_KEY',
                appId: '$APP_ID',
                messagingSenderId: '$SENDER_ID',
                projectId: '$PROJECT_ID',
              );

              static const FirebaseOptions ios = FirebaseOptions(
                apiKey: '$API_KEY',
                appId: '$APP_ID',
                messagingSenderId: '$SENDER_ID',
                projectId: '$PROJECT_ID',
                iosBundleId: 'CI-STUB',
              );

              static const FirebaseOptions macos = FirebaseOptions(
                apiKey: '$API_KEY',
                appId: '$APP_ID',
                messagingSenderId: '$SENDER_ID',
                projectId: '$PROJECT_ID',
                iosBundleId: 'CI-STUB',
              );

              static const FirebaseOptions windows = FirebaseOptions(
                apiKey: '$API_KEY',
                appId: '$APP_ID',
                messagingSenderId: '$SENDER_ID',
                projectId: '$PROJECT_ID',
              );
            }
          EOF
          fi
      - name: Require Firebase configuration for release APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          for value in "$FIREBASE_API_KEY" "$FIREBASE_APP_ID" "$FIREBASE_MESSAGING_SENDER_ID" "$FIREBASE_PROJECT_ID"; do
            if [ -z "$value" ]; then
              echo "::error title=Missing Firebase configuration::Set FIREBASE_API_KEY, FIREBASE_APP_ID, FIREBASE_MESSAGING_SENDER_ID, and FIREBASE_PROJECT_ID before building a release APK."
              exit 1
            fi
          done
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          storeFile=../upload-keystore.jks
          EOF
            echo "Release signing configured from secrets (stable SHA-1)."
          else
            echo "::error title=Missing Android signing::Set ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_ALIAS before building a release APK."
            exit 1
          fi
      - run: flutter analyze
      - name: Build release APK
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          FLAGS=""
          if [ -n "$BUILD_NAME" ]; then FLAGS="$FLAGS --build-name=$BUILD_NAME"; fi
          if [ -n "$BUILD_NUMBER" ]; then FLAGS="$FLAGS --build-number=$BUILD_NUMBER"; fi
          flutter build apk --release $FLAGS --dart-define=BLOOM_API="$API_URL"
          echo "Built $(grep -m1 '^version:' pubspec.yaml)${FLAGS:+ with overrides:$FLAGS}"
      - name: Verify APK signer certificate
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          EXPECTED="$EXPECTED_SIGNER_SHA1"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Signer of $APK (via $APKSIGNER):"
          CERTS=$("$APKSIGNER" verify --print-certs "$APK" 2>&1)
          echo "$CERTS"
          SIGNER=$(echo "$CERTS" | sed -n 's/.*certificate SHA-1 digest: *//p' | head -1 | tr -d ':' | tr 'a-f' 'A-F')
          echo "APK signer SHA-1: ${SIGNER:-<unreadable>} (expected $EXPECTED)"
          if [ "$SIGNER" != "$EXPECTED" ]; then
            echo "::error title=Unexpected APK signer::APK is signed with ${SIGNER:-an unreadable certificate}, not $EXPECTED. Refusing to publish this artifact."
            exit 1
          fi
      - name: Verify baked Firebase configuration
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          EXPECTED_PROJECT="$EXPECTED_FIREBASE_PROJECT"
          EXPECTED_APP_ID="$EXPECTED_ANDROID_APP_ID"
          ENTRY=$(unzip -Z1 "$APK" | grep -m1 'libapp\.so$')
          SNAPSHOT=$(mktemp)
          unzip -p "$APK" "$ENTRY" > "$SNAPSHOT"
          echo "Baked Android app id(s): $(grep -a -o -E '1:[0-9]{6,}:android:[a-f0-9]+' "$SNAPSHOT" | sort -u | tr '\n' ' ')"
          STATUS=0
          for pair in "project id:$EXPECTED_PROJECT" "Android app id:$EXPECTED_APP_ID"; do
            LABEL=${pair%%:*}; VALUE=${pair#*:}
            if grep -a -q -F -- "$VALUE" "$SNAPSHOT"; then
              echo "OK: $LABEL $VALUE"
            else
              echo "::error title=Stale Firebase configuration::The APK was built without the expected $LABEL ($VALUE); check FIREBASE_PROJECT_ID / FIREBASE_APP_ID."
              STATUS=1
            fi
          done
          rm -f "$SNAPSHOT"
          exit $STATUS
      - name: Verify baked Google web client ID
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ENTRY=$(unzip -Z1 "$APK" | grep -m1 'libapp\.so$')
          SNAPSHOT=$(mktemp)
          unzip -p "$APK" "$ENTRY" > "$SNAPSHOT"
          echo "Baked Google client id(s): $(grep -a -o -E '[0-9]{6,}-[a-z0-9]+\.apps\.googleusercontent\.com' "$SNAPSHOT" | sort -u | tr '\n' ' ')"
          if grep -a -q -F -- "$EXPECTED_WEB_CLIENT_ID" "$SNAPSHOT"; then
            echo "OK: Google web client id $EXPECTED_WEB_CLIENT_ID"
          else
            echo "::error title=Missing Google web client ID::GoogleSignIn's serverClientId is not baked into this APK, so the ID token would have no audience. Check AuthStore.googleWebClientId."
            rm -f "$SNAPSHOT"
            exit 1
          fi
          rm -f "$SNAPSHOT"
      - uses: actions/upload-artifact@v4
        with:
          name: daily-bloom-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
