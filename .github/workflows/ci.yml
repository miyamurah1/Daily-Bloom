name: ci

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bloom
          POSTGRES_PASSWORD: bloom_ci_password
          POSTGRES_DB: daily_bloom
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: server
      - run: node --check src/index.js && node --check scripts/migrate.js
        working-directory: server
      # Auth is Firebase in prod (no mintable tokens in CI), so the suite
      # runs against the test-only bypass: server AND tests share
      # NODE_ENV=test + TEST_BYPASS_TOKEN (see server/test/api.test.js).
      - run: npm run migrate
        working-directory: server
        env:
          DATABASE_URL: postgres://bloom:bloom_ci_password@localhost:5433/daily_bloom
          NODE_ENV: test
          TEST_BYPASS_TOKEN: ci-local-secret
      - run: |
          (npm start &)
          sleep 6
          npm test
          pkill -f "node src/index.js" || true
        working-directory: server
        env:
          DATABASE_URL: postgres://bloom:bloom_ci_password@localhost:5433/daily_bloom
          NODE_ENV: test
          TEST_BYPASS_TOKEN: ci-local-secret

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # firebase_options.dart is gitignored (from `flutterfire configure`).
      # Same stub as the apk workflow: analyze/test pass, Firebase calls
      # fail closed at runtime and the app runs offline.
      - name: Generate Firebase options stub if missing
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            cat > lib/firebase_options.dart <<'EOF'
            // CI stub: real values come from `flutterfire configure`
            // (gitignored). Offline-safe: Firebase init is guarded.
            import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
            import 'package:flutter/foundation.dart'
                show TargetPlatform, defaultTargetPlatform, kIsWeb;

            class DefaultFirebaseOptions {
              static FirebaseOptions get currentPlatform {
                if (kIsWeb) {
                  return web;
                }
                switch (defaultTargetPlatform) {
                  case TargetPlatform.android:
                    return android;
                  case TargetPlatform.iOS:
                    return ios;
                  case TargetPlatform.macOS:
                    return macos;
                  case TargetPlatform.windows:
                    return windows;
                  default:
                    throw UnsupportedError(
                      'DefaultFirebaseOptions are not supported for this platform.',
                    );
                }
              }

              static const FirebaseOptions web = FirebaseOptions(
                apiKey: 'CI-STUB',
                appId: 'CI-STUB',
                messagingSenderId: 'CI-STUB',
                projectId: 'CI-STUB',
              );

              static const FirebaseOptions android = FirebaseOptions(
                apiKey: 'CI-STUB',
                appId: 'CI-STUB',
                messagingSenderId: 'CI-STUB',
                projectId: 'CI-STUB',
              );

              static const FirebaseOptions ios = FirebaseOptions(
                apiKey: 'CI-STUB',
                appId: 'CI-STUB',
                messagingSenderId: 'CI-STUB',
                projectId: 'CI-STUB',
                iosBundleId: 'CI-STUB',
              );

              static const FirebaseOptions macos = FirebaseOptions(
                apiKey: 'CI-STUB',
                appId: 'CI-STUB',
                messagingSenderId: 'CI-STUB',
                projectId: 'CI-STUB',
                iosBundleId: 'CI-STUB',
              );

              static const FirebaseOptions windows = FirebaseOptions(
                apiKey: 'CI-STUB',
                appId: 'CI-STUB',
                messagingSenderId: 'CI-STUB',
                projectId: 'CI-STUB',
              );
            }
          EOF
          fi
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # End-to-end integration test on a real Android emulator. Runs the same
  # AppShell flow as test/app_flow_test.dart, but on a device.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Same Firebase stub as above: the emulator build needs the import
      # to resolve; auth calls fail closed and the flow runs offline.
      - name: Generate Firebase options stub if missing
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            cat > lib/firebase_options.dart <<'EOF'
            // CI stub: real values come from `flutterfire configure`
            // (gitignored). Offline-safe: Firebase init is guarded.
            import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
            import 'package:flutter/foundation.dart'
                show TargetPlatform, defaultTargetPlatform, kIsWeb;

            class DefaultFirebaseOptions {
              static FirebaseOptions get currentPlatform {
                if (kIsWeb) {
                  return web;
                }
                switch (defaultTargetPlatform) {
                  case TargetPlatform.android:
                    return android;
                  case TargetPlatform.iOS:
                    return ios;
                  case TargetPlatform.macOS:
                    return macos;
                  case TargetPlatform.windows:
                    return windows;
                  default:
                    throw UnsupportedError(
                      'DefaultFirebaseOptions are not supported for this platform.',
                    );
                }
              }

              static const FirebaseOptions web = FirebaseOptions(
                apiKey: 'CI-STUB',
                appId: 'CI-STUB',
                messagingSenderId: 'CI-STUB',
                projectId: 'CI-STUB',
              );

              static const FirebaseOptions android = FirebaseOptions(
                apiKey: 'CI-STUB',
                appId: 'CI-STUB',
                messagingSenderId: 'CI-STUB',
                projectId: 'CI-STUB',
              );

              static const FirebaseOptions ios = FirebaseOptions(
                apiKey: 'CI-STUB',
                appId: 'CI-STUB',
                messagingSenderId: 'CI-STUB',
                projectId: 'CI-STUB',
                iosBundleId: 'CI-STUB',
              );

              static const FirebaseOptions macos = FirebaseOptions(
                apiKey: 'CI-STUB',
                appId: 'CI-STUB',
                messagingSenderId: 'CI-STUB',
                projectId: 'CI-STUB',
                iosBundleId: 'CI-STUB',
              );

              static const FirebaseOptions windows = FirebaseOptions(
                apiKey: 'CI-STUB',
                appId: 'CI-STUB',
                messagingSenderId: 'CI-STUB',
                projectId: 'CI-STUB',
              );
            }
          EOF
          fi
      - name: Run integration tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: flutter test integration_test -d emulator-5554
